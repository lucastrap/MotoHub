name: Supervision production

on:
  schedule:

    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: supervision-production
  cancel-in-progress: false

jobs:
  probe:
    name: Sonde /api/health
    runs-on: ubuntu-latest

    if: vars.PRODUCTION_URL != ''
    permissions:
      issues: write

    steps:
      - name: Interroger la sonde de santé
        id: probe
        run: |
          URL="${{ vars.PRODUCTION_URL }}/api/health"
          echo "Sonde : $URL"

          # Trois tentatives espacées de 20 s. Un incident n'est déclaré qu'après
          # trois échecs consécutifs : une alerte sur un aléa réseau isolé
          # décrédibilise le dispositif et finit par être ignorée.
          for attempt in 1 2 3; do
            body=$(mktemp)
            metrics=$(curl -s -o "$body" -w "%{http_code} %{time_total}" \
                       --max-time 15 "$URL" || echo "000 0")
            code=$(echo "$metrics" | cut -d' ' -f1)
            total=$(echo "$metrics" | cut -d' ' -f2)
            status=$(jq -r '.status // "inconnu"' "$body" 2>/dev/null || echo "illisible")
            db_latency=$(jq -r '.latencyMs // "n/a"' "$body" 2>/dev/null || echo "n/a")
            version=$(jq -r '.version // "n/a"' "$body" 2>/dev/null || echo "n/a")
            commit=$(jq -r '.commit // "n/a"' "$body" 2>/dev/null || echo "n/a")

            echo "Tentative $attempt : HTTP $code · status=$status · latence DB ${db_latency}ms · réponse ${total}s"

            if [ "$code" = "200" ] && { [ "$status" = "ok" ] || [ "$status" = "degraded" ]; }; then
              {
                echo "healthy=true"
                echo "status=$status"
                echo "http_code=$code"
                echo "db_latency=$db_latency"
                echo "response_time=$total"
                echo "version=$version"
                echo "commit=$commit"
              } >> "$GITHUB_OUTPUT"
              echo "### Sonde OK : status \`$status\`, latence DB ${db_latency} ms" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            [ "$attempt" -lt 3 ] && sleep 20
          done

          # Trois échecs consécutifs : incident confirmé.
          {
            echo "healthy=false"
            echo "status=$status"
            echo "http_code=$code"
            echo "db_latency=$db_latency"
            echo "response_time=$total"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "### Sonde EN ÉCHEC : HTTP $code, status \`$status\` (3 tentatives)" >> "$GITHUB_STEP_SUMMARY"


      - name: Restaurer le compteur de dégradations
        uses: actions/cache/restore@v4
        with:
          path: .supervision-degradations
          key: supervision-degradations-${{ github.run_id }}
          restore-keys: |
            supervision-degradations-

      - name: Escalader une dégradation persistante
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = ${{ toJSON(steps.probe.outputs) }};
            const fichier = '.supervision-degradations';
            const marqueur = '<!-- supervision-degradation -->';
            // 3 exécutions consécutives, soit 45 min de dégradation continue.
            const SEUIL = 3;

            const precedent = fs.existsSync(fichier)
              ? parseInt(fs.readFileSync(fichier, 'utf8').trim(), 10) || 0
              : 0;
            // Une indisponibilité franche relève de l'autre chemin : elle remet
            // le compteur de dégradation à zéro plutôt que de s'y ajouter.
            const consecutives =
              p.healthy === 'true' && p.status === 'degraded' ? precedent + 1 : 0;
            fs.writeFileSync(fichier, String(consecutives));
            core.notice(`Dégradations consécutives : ${consecutives} (seuil : ${SEUIL})`);

            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'degradation',
            });
            const existante = ouvertes.find(i => (i.body || '').includes(marqueur));

            const detail = [
              `| Indicateur | Valeur |`,
              `|---|---|`,
              `| Statut applicatif | \`${p.status}\` |`,
              `| Latence base | ${p.db_latency} ms (seuil : 1000 ms) |`,
              `| Temps de réponse | ${p.response_time} s |`,
              `| Version déployée | ${p.version} (\`${p.commit}\`) |`,
              `| Exécutions consécutives dégradées | ${consecutives} |`,
              `| Constaté le | ${new Date().toISOString()} |`,
              `| Exécution | ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} |`,
            ].join('\n');

            if (consecutives === 0) {
              if (existante) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existante.number,
                  body: `**Retour à la normale** : la latence est repassée sous le seuil.\n\n${detail}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existante.number,
                  state: 'closed',
                });
                core.notice(`Dégradation #${existante.number} refermée.`);
              }
              return;
            }

            if (consecutives < SEUIL) {
              // En deçà du seuil, on n'ouvre rien : une dégradation isolée est
              // déjà tracée dans Sentry en `warning`.
              core.notice(`Sous le seuil, aucune issue ouverte.`);
              return;
            }

            if (existante) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existante.number,
                body: `**Dégradation toujours en cours.**\n\n${detail}`,
              });
              core.notice(`Dégradation #${existante.number} mise à jour.`);
              return;
            }

            const { data: creee } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DÉGRADATION] Latence base au-dessus du seuil sur ${SEUIL} exécutions`,
              labels: ['degradation', 'production', 'severite:majeur'],
              body: [
                marqueur,
                `## Détection automatique`,
                ``,
                `La sonde \`/api/health\` renvoie \`degraded\` depuis **${SEUIL} exécutions consécutives**,`,
                `soit environ 45 minutes de dégradation continue. L'application répond, la base est`,
                `joignable, mais au-delà du seuil de latence retenu.`,
                ``,
                detail,
                ``,
                `## Conduite à tenir`,
                ``,
                `1. Confirmer : \`curl -s ${{ vars.PRODUCTION_URL }}/api/health | jq .checks\``,
                `2. Vérifier le pooler et la charge de l'instance (tableau de bord Supabase).`,
                `3. Comparer avec le déploiement en cours : la dégradation suit-elle une mise en production ?`,
                `4. Chercher dans Sentry les \`warning\` émis par le transport Winston sur la même période.`,
                `5. Qualifier et suivre \`docs/procedure-incidents.md\`.`,
                ``,
                `_Refermée automatiquement au retour de la latence sous le seuil._`,
              ].join('\n'),
            });
            core.notice(`Dégradation ouverte : #${creee.number}`);

      - name: Conserver le compteur de dégradations
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .supervision-degradations
          key: supervision-degradations-${{ github.run_id }}

      - name: Alerter (ouvrir ou mettre à jour l'incident)
        if: steps.probe.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const p = ${{ toJSON(steps.probe.outputs) }};
            const marqueur = '<!-- supervision-incident -->';

            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
            });
            const existante = ouvertes.find(i => (i.body || '').includes(marqueur));

            const detail = [
              `| Indicateur | Valeur |`,
              `|---|---|`,
              `| Code HTTP | \`${p.http_code}\` |`,
              `| Statut applicatif | \`${p.status}\` |`,
              `| Latence base | ${p.db_latency} ms |`,
              `| Temps de réponse | ${p.response_time} s |`,
              `| Version déployée | ${p.version} (\`${p.commit}\`) |`,
              `| Détecté le | ${new Date().toISOString()} |`,
              `| Exécution | ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} |`,
            ].join('\n');

            if (existante) {
              // Incident déjà connu : on horodate la persistance plutôt que
              // d'empiler des issues en double.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existante.number,
                body: `**Incident toujours en cours** : sonde à nouveau en échec.\n\n${detail}`,
              });
              core.notice(`Incident #${existante.number} mis à jour.`);
              return;
            }

            const { data: creee } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] Production indisponible : sonde /api/health en échec`,
              labels: ['incident', 'production'],
              body: [
                marqueur,
                `## Détection automatique`,
                ``,
                `La sonde \`/api/health\` a échoué **3 fois consécutivement** (tentatives espacées de 20 s).`,
                ``,
                detail,
                ``,
                `## Conduite à tenir`,
                ``,
                `Voir le runbook : \`docs/supervision-monitoring.md\` § « Procédure de levée d'alerte ».`,
                ``,
                `1. Confirmer manuellement : \`curl -i ${{ vars.PRODUCTION_URL }}/api/health\``,
                `2. Vérifier l'état de la base (tableau de bord Supabase) et du déploiement (Vercel).`,
                `3. Si l'incident suit un déploiement, envisager le retour arrière Vercel (promouvoir le déploiement stable précédent).`,
                `4. Qualifier la sévérité et suivre \`docs/procedure-incidents.md\`.`,
                ``,
                `_Cette issue sera commentée et refermée automatiquement au retour à la normale._`,
              ].join('\n'),
            });
            core.setFailed(`Incident ouvert : #${creee.number}`);

      - name: Clore l'incident au retour à la normale
        if: steps.probe.outputs.healthy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const p = ${{ toJSON(steps.probe.outputs) }};
            const marqueur = '<!-- supervision-incident -->';

            const { data: ouvertes } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident',
            });
            const existante = ouvertes.find(i => (i.body || '').includes(marqueur));
            if (!existante) return;

            const dureeMin = Math.round(
              (Date.now() - new Date(existante.created_at).getTime()) / 60000
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existante.number,
              body: [
                `**Retour à la normale** : la sonde répond de nouveau.`,
                ``,
                `| Indicateur | Valeur |`,
                `|---|---|`,
                `| Statut applicatif | \`${p.status}\` |`,
                `| Latence base | ${p.db_latency} ms |`,
                `| Version déployée | ${p.version} (\`${p.commit}\`) |`,
                `| Durée d'indisponibilité constatée | ~${dureeMin} min (borne haute : granularité de la sonde, 15 min) |`,
                ``,
                `Rédiger le compte rendu d'incident avant clôture définitive`,
                `(\`docs/procedure-incidents.md\` § « Registre des incidents »).`,
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existante.number,
              state: 'closed',
            });
            core.notice(`Incident #${existante.number} refermé après ~${dureeMin} min.`);
